; Camera tuning. Positions of fixed shots (intro, close-ups) are Camera3D nodes in the scenes,
; so they can be previewed and nudged in the editor; their FOV comes from the node.

[follow]

; spring arm length behind the player (shortens automatically against walls)
distance=3.6
; pivot height above the player's feet
height=1.45
; sideways offset for an over-the-shoulder look (0 = centred)
shoulder_offset=0.35
fov=62.0
; radians per pixel of mouse motion
mouse_sensitivity=0.0032
invert_y=false
; pitch limits in degrees (negative looks down)
pitch_min=-55.0
pitch_max=20.0
start_pitch=-12.0
; how quickly the pivot catches up with the player (higher = tighter)
follow_smoothing=9.0
; keep the camera this far off walls/cars
collision_margin=0.25

[shot]

; default seconds to blend into / out of a fixed shot
blend_time=0.9

[intro]

enabled=true
; seconds for the dolly from IntroStart to IntroEnd
duration=6.0
; seconds to blend from IntroEnd down to the follow camera
handoff=1.6

[overview]

; debug / look-dev camera (main.gd --campos)
fov=48.0

; Character animation + mechanical tween tuning.
; Code only ever asks for LOGICAL clip names (idle, walk, pump_jack, ...). The [clips.<slot>]
; sections map those to the clip names inside that character's AnimationPlayer. The placeholder
; uses the logical names as-is; for a Mixamo model change the right-hand side, e.g.
;   walk="mixamo/Walking"      (library "mixamo", clip "Walking")
; A logical name missing from the map falls back to itself. Append @speed to change playback:
;   stand_up="kneeling_down/mixamo_com@-1"   (Mixamo's "Kneeling Down", played backwards)

[clips.player]

idle="idle"
walk="walk"
jog="jog"
kneel_down="kneel_down"
stand_up="stand_up"
kneel_idle="kneel_idle"
wrench_loosen="wrench_loosen"
wrench_unscrew="wrench_unscrew"
wrench_tighten="wrench_tighten"
thread_nuts="thread_nuts"
place_jack="place_jack"
pump_jack="pump_jack"
release_jack="release_jack"
pull_wheel="pull_wheel"
fit_wheel="fit_wheel"
pick_up="pick_up"
shrug="shrug"

[clips.npc_phone]

idle="idle"
lean_phone="lean_phone"
lean_glance="lean_glance"
shift_weight="shift_weight"

[clips.npc_mechanic]

idle="idle"
walk="walk"
jog="jog"
work_overhead="work_overhead"
look_around="look_around"
browse_shelf="browse_shelf"
kneel_down="kneel_down"
kneel_idle="kneel_idle"
stand_up="stand_up"

[blend]

; seconds of crossfade between clips
default=0.22
locomotion=0.18

[locomotion]

; below this ground speed (m/s) the character idles, above jog_above it jogs
idle_below=0.15
jog_above=2.4
; ground speed at which each clip plays at 1x (keeps feet from sliding)
walk_clip_speed=1.45
jog_clip_speed=3.6
min_playback_scale=0.6
max_playback_scale=1.5

[mechanics]

; --- tween timings (seconds) and amounts for the props ---
; loosening / final tightening: one wrench pull per nut
nut_turn_time=0.55
nut_turn_deg=90.0
; spinning a loose nut off / threading it back on
unscrew_time=0.45
unscrew_turns=3.0
thread_time=0.4
; length of thread a nut travels before it is off the stud
thread_length=0.03
; flat wheel slides this far off the hub, then is laid down
wheel_slide_distance=0.3
wheel_slide_time=0.6
wheel_lay_time=0.7
; spare slides onto the hub
fit_time=0.7
; floor jack rolls under the jack point / back out
jack_roll_time=0.8
jack_pump_strokes=4
jack_stroke_time=0.6
lower_time=1.8
; items fly to the hand on the pick-up beat
pickup_time=0.35

; how far the jack lifts the car at the jack point (metres)
car_lift_height=0.12
; lift-arm rotation (degrees) when the car is fully raised
jack_arm_raise_deg=17.0
; handle swing (degrees) for one pump stroke
jack_pump_swing_deg=28.0
; a loosened nut backs out this far (metres)
nut_backout=0.006
; dropped items at the same spot are spaced this far apart
drop_spacing=0.28

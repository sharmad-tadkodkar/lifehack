; Character animation + mechanical tween tuning.
; Code only ever asks for LOGICAL clip names (idle, walk, pump_jack, ...). The [clips.<slot>]
; sections map those to the clip names inside that character's AnimationPlayer. The placeholder
; uses the logical names as-is; for a Mixamo model change the right-hand side, e.g.
;   walk="mixamo/Walking"      (library "mixamo", clip "Walking")
; A logical name missing from the map falls back to itself. Append @speed to change playback:
;   stand_up="kneeling_down/mixamo_com@-1"   (Mixamo's "Kneeling Down", played backwards)

[clips.player]

; Mixamo clips are "library/clip": the library is the file name in snake_case, the clip is
; "mixamo_com". "|" lists fallbacks (first one the model has wins); "@0" holds the first frame.
; Breathing Idle / Standard Walk / Jogging are not downloaded yet: until they are, idle, walk
; and jog hold the neutral first frame of Shrugging.
idle="breathing_idle/mixamo_com|shrugging/mixamo_com@0|idle"
walk="standard_walk/mixamo_com|walking/mixamo_com|shrugging/mixamo_com@0|walk"
jog="jogging/mixamo_com|standard_walk/mixamo_com|shrugging/mixamo_com@0|jog"
kneel_down="kneeling_down/mixamo_com|kneel_down"
stand_up="kneeling_down/mixamo_com@-1|stand_up"
kneel_idle="kneeling_idle/mixamo_com|kneel_idle"
wrench_loosen="kneeling_inspecting/mixamo_com|wrench_loosen"
wrench_unscrew="kneeling_inspecting/mixamo_com|wrench_unscrew"
wrench_tighten="kneeling_inspecting/mixamo_com|wrench_tighten"
thread_nuts="kneeling_inspecting/mixamo_com|thread_nuts"
place_jack="plant_a_plant/mixamo_com|kneeling_inspecting/mixamo_com|place_jack"
pump_jack="pulling_lever/mixamo_com|pump_jack"
release_jack="working_on_device/mixamo_com|pulling_lever/mixamo_com|release_jack"
pull_wheel="pull_heavy_object/mixamo_com|pull_wheel"
fit_wheel="pushing/mixamo_com|fit_wheel"
pick_up="picking_up/mixamo_com|pick_up"
shrug="shrugging/mixamo_com|shrug"

[clips.npc_phone]

idle="breathing_idle/mixamo_com|texting_while_standing/mixamo_com|idle"
lean_phone="texting_while_standing/mixamo_com|lean_phone"
lean_glance="looking_around/mixamo_com|texting_while_standing/mixamo_com|lean_glance"
shift_weight="idle/mixamo_com|texting_while_standing/mixamo_com|shift_weight"

[clips.npc_mechanic]

idle="breathing_idle/mixamo_com|shrugging/mixamo_com@0|idle"
walk="standard_walk/mixamo_com|walking/mixamo_com|shrugging/mixamo_com@0|walk"
jog="jogging/mixamo_com|standard_walk/mixamo_com|shrugging/mixamo_com@0|jog"
work_overhead="standing_torch_inspect_upward/mixamo_com|work_overhead"
look_around="looking_around/mixamo_com|standing_torch_inspect_upward/mixamo_com|look_around"
browse_shelf="picking_up/mixamo_com|browse_shelf"
kneel_down="kneeling_down/mixamo_com|kneel_down"
kneel_idle="kneeling_inspecting/mixamo_com|kneel_idle"
stand_up="kneeling_down/mixamo_com@-1|stand_up"

[blend]

; seconds of crossfade between clips
default=0.22
locomotion=0.18

[locomotion]

; below this ground speed (m/s) the character idles, above jog_above it jogs
idle_below=0.15
jog_above=2.4
; ground speed at which each clip plays at 1x (keeps feet from sliding)
walk_clip_speed=1.45
jog_clip_speed=3.6
min_playback_scale=0.6
max_playback_scale=1.5

[mechanics]

; --- tween timings (seconds) and amounts for the props ---
; loosening / final tightening: one wrench pull per nut
nut_turn_time=0.55
nut_turn_deg=90.0
; spinning a loose nut off / threading it back on
unscrew_time=0.45
unscrew_turns=3.0
thread_time=0.4
; length of thread a nut travels before it is off the stud
thread_length=0.03
; flat wheel slides this far off the hub, then is laid down
wheel_slide_distance=0.3
wheel_slide_time=0.6
wheel_lay_time=0.7
; spare slides onto the hub
fit_time=0.7
; floor jack rolls under the jack point / back out
jack_roll_time=0.8
jack_pump_strokes=4
jack_stroke_time=0.6
lower_time=1.8
; items fly to the hand on the pick-up beat
pickup_time=0.35

; how far the jack lifts the car at the jack point (metres)
car_lift_height=0.12
; lift-arm rotation (degrees) when the car is fully raised
jack_arm_raise_deg=17.0
; handle swing (degrees) for one pump stroke
jack_pump_swing_deg=28.0
; a loosened nut backs out this far (metres)
nut_backout=0.006
; dropped items at the same spot are spaced this far apart
drop_spacing=0.28

[mixamo_import]

; used by tools/setup_mixamo.gd: Mixamo animation files (file name without .fbx) that loop
loop_files=["Kneeling Idle", "Kneeling Inspecting", "Pulling Lever", "Standing Torch Inspect Upward", "Texting While Standing", "Breathing Idle", "Standard Walk", "Jogging", "Walking"]

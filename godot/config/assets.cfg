; Asset slots: where real models plug in. See ASSETS.md for the full checklist.
;   model=""      use the slot's placeholder scene
;   model="res://assets/models/car/car.glb"   use that file instead (GLB, FBX or .tscn)
;   scale / offset / rotation_deg   fix up an imported model without touching the scene
; *_node / *_bone name the parts inside the model that the code animates.

[car]

; Hoonicorn V2 (Sketchfab, CC-BY 4.0, RocketGT). Modelled ~2.8x real size, facing +Z, origin on
; the rear axle: scaled, turned to face -Z and moved so the axles straddle the slot origin.
model="res://assets/models/hoonicorn_v2_rigged_blender/scene.gltf"
scale=0.36
offset=Vector3(0, 0, 1.3375)
rotation_deg=Vector3(0, 180, 0)
; the wheel that goes flat: a separate node whose origin sits at the hub centre
flat_wheel_node="DEF-Wheel_Ft_L_3"
; put the hub pivot (FlatWheelPivot) exactly on that wheel's origin
align_hub_to_flat_wheel=true
; this model has the lug bolts baked into each wheel; hide them on the flat, the game's nuts take over
flat_wheel_hide_materials=["Tire_Bolts"]
; lug nut layout on the hub (metres): bolt circle radius, and how far out from the hub
; pivot (along the axle) the nuts seat
bolt_circle_radius=0.05
nut_seat_offset=-0.02

[car_background]

; the car up on the lift (same Hoonicorn)
model="res://assets/models/hoonicorn_v2_rigged_blender/scene.gltf"
scale=0.36
offset=Vector3(0, 0, 1.3375)
rotation_deg=Vector3(0, 180, 0)
flat_wheel_node="DEF-Wheel_Ft_L_3"

[wheel]

; the spare: one wheel out of Rims_N_Tyres_kit_1.0 (Sketchfab, CC-BY 4.0, britdawgmasterfunk).
; part = the kit node to use; it is centred on the slot origin. Axle along X.
model="res://assets/models/rims_n_tyres_kit_1/scene.gltf"
part="Wheel Rear Left_30"
scale=0.443
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)

[lug_nut]

model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)

[jack]

; Hydraulic (bottle) jack (Sketchfab, CC-BY 4.0, Ben Milette). Origin under the piston.
model="res://assets/models/hydraulic_jack/scene.gltf"
scale=0.25
offset=Vector3(0, 0, 0)
; turn the handle socket (+X in the file) to face out from under the car
rotation_deg=Vector3(0, -90, 0)
; "rotate" = floor jack (lift_arm_node swings up); "translate" = bottle jack (lift_nodes slide up)
lift_mode="translate"
lift_nodes=["Main_Piston_low_0", "Main_Threaded_low_2"]
lift_arm_node=""
handle_node="Handle_low_7"
; borrow the handle's "seated in the socket" pose from the model's own animation at this time
handle_pose_clip="Animation"
handle_pose_time=4.7

[tool_cart]

model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)

[lug_wrench]

; Lug Wrench (Cross Wheel Spanner) (Sketchfab, CC-BY 4.0, dinoxwave). Modelled at ~half size and
; centred: scaled to ~0.6 m and shifted so the -Z socket sits on the slot origin.
model="res://assets/models/lug_wrench_cross_wheel_spanner/scene.gltf"
scale=1.9
offset=Vector3(0, 0, 0.2945)
rotation_deg=Vector3(0, 0, 0)

[phone]

; the phone the workbench NPC is glued to (emissive screen; origin at the grip)
model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)

[player]

; casual guy (Mixamo); this file is modelled ~2.1x real size. Bones retargeted to Godot's humanoid profile by tools/setup_mixamo.gd.
model="res://assets/models/character.fbx"
scale=0.47
offset=Vector3(0, 0, 0)
; Mixamo characters face +Z; the game's forward is -Z
rotation_deg=Vector3(0, 180, 0)
hand_bone="RightHand"
; hand socket (where held tools sit): fraction of the way from the wrist to the knuckles, and
; metres out of the palm, so a closed hand (animation.cfg [carry]) wraps around the handle
palm_offset=0.85
palm_depth=0.02
; every Mixamo clip imported as an AnimationLibrary in this folder is added to the character
animation_dir="res://assets/models"

[npc_phone]

; woman in the blue shirt (Mixamo). Bones retargeted to Godot's humanoid profile by tools/setup_mixamo.gd.
model="res://assets/models/character-2.fbx"
scale=1.0
offset=Vector3(0, 0, 0)
; Mixamo characters face +Z; the game's forward is -Z
rotation_deg=Vector3(0, 180, 0)
hand_bone="RightHand"
; every Mixamo clip imported as an AnimationLibrary in this folder is added to the character
animation_dir="res://assets/models"

[npc_mechanic]

; driver in the red race suit (Mixamo). Bones retargeted to Godot's humanoid profile by tools/setup_mixamo.gd.
model="res://assets/models/character-3.fbx"
scale=1.0
offset=Vector3(0, 0, 0)
; Mixamo characters face +Z; the game's forward is -Z
rotation_deg=Vector3(0, 180, 0)
hand_bone="RightHand"
; every Mixamo clip imported as an AnimationLibrary in this folder is added to the character
animation_dir="res://assets/models"

[floor_textures]

; Poly Haven "Garage Floor" (CC0). Each map is optional. The 4K normal/roughness EXRs use DWA
; compression, which Godot cannot read, so normals come from the displacement map instead; drop
; PNG versions of the Normal (GL) / Rough maps in the same folder and point these at them.
albedo="res://assets/textures/garage_floor_4k/textures/garage_floor_diff_4k.jpg"
normal=""
roughness=""
height="res://assets/textures/garage_floor_4k/textures/garage_floor_disp_4k.png"
; texture repeats per metre
tiling=0.4


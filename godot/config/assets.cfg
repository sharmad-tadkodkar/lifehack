; Asset slots: where real models plug in. See ASSETS.md for the full checklist.
;   model=""      use the slot's placeholder scene
;   model="res://assets/models/car/car.glb"   use that file instead (GLB, FBX or .tscn)
;   scale / offset / rotation_deg   fix up an imported model without touching the scene
; *_node / *_bone name the parts inside the model that the code animates.

[car]

model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)
; the wheel that goes flat: a separate node whose origin sits at the hub centre
flat_wheel_node="Wheel_FL"
; lug nut layout on the hub (metres): bolt circle radius, and how far out from the hub
; centre (along the axle) the nuts seat. 5x114.3 mm is a common pattern.
bolt_circle_radius=0.0572
nut_seat_offset=0.112

[car_background]

; the car up on the lift (can be the same file as [car])
model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)
flat_wheel_node="Wheel_FL"

[wheel]

; the spare: origin at the hub centre, axle along +X (outer face pointing +X)
model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)

[lug_nut]

model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)

[jack]

; floor (trolley) jack: handle and lift arm must be separate nodes pivoting at their hinges
model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)
handle_node="Handle"
lift_arm_node="LiftArm"

[tool_cart]

model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)

[lug_wrench]

model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)

[phone]

; the phone the workbench NPC is glued to (emissive screen; origin at the grip)
model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)

[player]

model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)
hand_bone="mixamorig_RightHand"

[npc_phone]

model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)
hand_bone="mixamorig_RightHand"

[npc_mechanic]

model=""
scale=1.0
offset=Vector3(0, 0, 0)
rotation_deg=Vector3(0, 0, 0)
hand_bone="mixamorig_RightHand"

[floor_textures]

; PBR set for the garage floor (e.g. a Poly Haven concrete). Empty = procedural concrete.
albedo=""
normal=""
roughness=""
; texture repeats per metre
tiling=0.25

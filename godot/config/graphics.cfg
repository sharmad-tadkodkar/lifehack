; Window and anti-aliasing. Applied once at boot by main.gd.

[window]

; "windowed", "maximized" or "fullscreen"
mode="maximized"
windowed_size=Vector2i(1600, 900)
vsync=true

[quality]

; 0 off, 1 = 2x, 2 = 4x, 3 = 8x
msaa_3d=2
taa=false
; 0 off, 1 FXAA, 2 SMAA
screen_space_aa=2
; 1.0 = native. Lower + fsr2 if the frame rate dips on a Retina display.
render_scale=1.0
; "bilinear", "fsr", "fsr2"
scaling_mode="bilinear"
show_fps=false

; HUD look and timing: an AR / heads-up style (cyan glass panels, corner brackets).

[colors]

; main HUD colour (frames, keys, progress) and text
accent=Color(0.32, 0.86, 1, 1)
text=Color(0.86, 0.96, 1, 1)
dim=Color(0.44, 0.64, 0.76, 1)
; warnings / mistakes, successes, and the Oh S#IT title
warn=Color(1, 0.46, 0.2, 1)
good=Color(0.42, 1, 0.74, 1)
brand=Color(1, 0.4, 0.22, 1)
; panel glass
panel=Color(0.01, 0.07, 0.12, 0.62)
panel_border=Color(0.32, 0.86, 1, 0.45)
; Esc menu: the dimmed game behind it, and the highlighted row
overlay=Color(0, 0.02, 0.04, 0.6)
highlight=Color(0.32, 0.86, 1, 0.14)

[fonts]

; display: headings, values, keys (Michroma, after Microgramma / Eurostile Extended);
; body: sentences (Rajdhani). Both SIL Open Font License, in assets/fonts.
display="res://assets/fonts/Michroma-Regular.ttf"
display_spacing=1
body="res://assets/fonts/Rajdhani-SemiBold.ttf"
body_bold="res://assets/fonts/Rajdhani-Bold.ttf"

[frame]

; panel frame: content inset, cut corner and bracket length (px), text glow strength / radius
margin=18
chamfer=14
bracket=16
glow=0.35
glow_size=6

[sizes]

title=60
subtitle=17
body=22
small=15
menu=22
tag=11
stat=24
summary_title=40
pause_title=30
key_cap=30
key_text=13
step_bar=8
status_width=270
toast_width=620

[timing]

; seconds a feedback message stays up
toast_seconds=4.5
mistake_toast_seconds=6.0
; title card fade at the end of the intro
title_fade=1.0
; a panel's flicker-in when it appears
reveal=0.28

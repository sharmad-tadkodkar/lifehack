; Key bindings. Each action lists key names as Godot spells them
; (see OS.find_keycode_from_string). Physical keys, so WASD works on any layout.

[actions]

move_forward=["W", "Up"]
move_back=["S", "Down"]
move_left=["A", "Left"]
move_right=["D", "Right"]
jog=["Shift"]
interact=["E"]
choice_1=["1"]
choice_2=["2"]
choice_3=["3"]
choice_4=["4"]
choice_5=["5"]
cancel=["Q", "Backspace"]
pause=["Escape"]
toggle_placeholder_labels=["F3"]
reload_config=["F5"]

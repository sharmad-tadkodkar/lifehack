; Night-garage look. Press F5 in-game to reload this file live.
;   [environment]      keys are Environment property names (see Godot docs)
;   [node.<Name>]      properties set on the node with that name under Garage (lights, probe)
;   [strip.<group>]    every LightStrip whose `group` matches
;   [hex_grid]         the hexagon LED canopy over the work bay
;   [floor]            uniforms of src/environment/shaders/garage_floor.gdshader

[gi]

; "sdfgi" (dynamic, no baking, works when models are swapped) or "none"
mode="sdfgi"

[environment]

; 1 = flat background colour
background_mode=1
background_color=Color(0.004, 0.005, 0.008, 1)
; 2 = constant ambient colour
ambient_light_source=2
ambient_light_color=Color(0.32, 0.4, 0.6, 1)
ambient_light_energy=0.05
; 1 = no sky reflections (the reflection probe supplies them)
reflected_light_source=1
; 4 = AgX
tonemap_mode=4
tonemap_exposure=1.0
ssr_enabled=true
ssr_max_steps=128
ssr_fade_in=0.1
ssr_fade_out=2.5
ssr_depth_tolerance=0.25
ssao_enabled=true
ssao_radius=1.0
ssao_intensity=2.2
ssao_power=1.6
ssil_enabled=true
ssil_radius=4.0
ssil_intensity=0.6
sdfgi_use_occlusion=true
sdfgi_min_cell_size=0.1
sdfgi_cascades=3
sdfgi_energy=1.0
sdfgi_bounce_feedback=0.4
glow_enabled=true
glow_intensity=0.7
glow_strength=1.0
glow_bloom=0.03
glow_hdr_threshold=1.0
glow_hdr_scale=2.0
; 0 additive, 1 screen, 2 softlight
glow_blend_mode=1
glow_levels/1=0.0
glow_levels/2=0.4
glow_levels/3=0.8
glow_levels/4=1.0
glow_levels/5=0.8
glow_levels/6=0.3
glow_levels/7=0.0
volumetric_fog_enabled=true
volumetric_fog_density=0.011
volumetric_fog_albedo=Color(0.78, 0.84, 0.95, 1)
volumetric_fog_anisotropy=0.5
volumetric_fog_length=36.0
volumetric_fog_gi_inject=0.2
volumetric_fog_ambient_inject=0.0
adjustment_enabled=true
adjustment_brightness=1.0
adjustment_contrast=1.1
adjustment_saturation=1.12

[hex_grid]

enabled=true
cell_radius=0.6
columns=8
rows=5
bar_width=0.05
bar_depth=0.04
color=Color(0.88, 0.94, 1, 1)
emission_energy=9.0

[strip.ceiling]

color=Color(0.82, 0.9, 1, 1)
emission_energy=6.0
light_energy=1.6
light_range=8.0
; area-light highlights render as round blobs on the wet floor; keep them low and let
; SSR / the reflection probe mirror the actual tubes
light_specular=0.12
shadows=false

[strip.magenta]

light_specular=0.25
color=Color(1, 0.1, 0.62, 1)
emission_energy=10.0
light_energy=2.5
light_range=6.0
shadows=false

[strip.cyan]

light_specular=0.25
color=Color(0.08, 0.82, 1, 1)
emission_energy=9.0
light_energy=1.8
light_range=5.0
shadows=false

[strip.ember]

light_specular=0.25
; the brand orange-red
color=Color(1, 0.3, 0.14, 1)
emission_energy=9.0
light_energy=1.6
light_range=4.0
shadows=false

[node.BayArea]

; soft key light from the hex canopy
light_color=Color(0.86, 0.92, 1, 1)
light_energy=9.0
; low specular: let SSR mirror the actual hex pattern instead of a hot blob
light_specular=0.3
light_volumetric_fog_energy=0.5
area_range=8.0
shadow_enabled=true

[node.DoorSpill]

; cold street light leaking under the half-open roller door
light_color=Color(0.42, 0.62, 1, 1)
light_energy=14.0
light_volumetric_fog_energy=5.0
spot_range=18.0
spot_angle=28.0
spot_attenuation=0.8
shadow_enabled=true

[node.BenchLamp]

; warm task lamp over the workbench
light_color=Color(1, 0.7, 0.42, 1)
light_energy=4.0
light_volumetric_fog_energy=1.5
spot_range=4.5
spot_angle=55.0
shadow_enabled=true

[node.RimLight]

; behind the hero car, traces its roofline
light_color=Color(0.55, 0.75, 1, 1)
light_energy=6.0
; low specular: a point source leaves a hard hot spot on the wet floor
light_specular=0.12
light_volumetric_fog_energy=1.0
spot_range=12.0
spot_angle=30.0
shadow_enabled=false

[node.SignGlow]

light_color=Color(1, 0.32, 0.16, 1)
light_energy=1.8
omni_range=4.0
shadow_enabled=false

[node.SignText]

; HDR colour > 1 makes the neon sign bloom
modulate=Color(3.2, 0.42, 0.16, 1)
outline_modulate=Color(1.6, 0.2, 0.08, 0.55)

[node.SignSubText]

modulate=Color(0.2, 1.6, 2.2, 1)
outline_modulate=Color(0.1, 0.9, 1.2, 0.5)

[node.ReflectionProbe]

intensity=1.0
box_projection=true
interior=true
blend_distance=1.0
; 0 = capture once
update_mode=0

[floor]

base_color=Color(0.07, 0.072, 0.076, 1)
base_roughness=0.5
wet_roughness=0.035
wet_amount=0.48
wet_scale=0.12
wet_edge=0.07
wet_darkening=0.55
grain_scale=3.5
grain_strength=0.18
specular_amount=0.5
; only used with a floor texture set (assets.cfg [floor_textures]): darkens the photo-scanned
; concrete to the night mood, and how strong the displacement-derived bumps are
albedo_tint=Color(0.32, 0.32, 0.34, 1)
height_normal_strength=6.0

; Sound effects, ambience, music and the narrator voice.
; Every sound is a slot: file="" uses the synthesized default res://assets/audio/<id>.wav
; (made by tools/build_audio.gd); set file="res://assets/audio/recorded/x.ogg" to use a recording.

[buses]

; mix levels (dB) of the buses AudioDirector creates
sfx_db=-2.0
music_db=-15.0
ambience_db=-26.0
voice_db=0.0

[music]

file=""
; music drops by this much (dB) while the narrator speaks, fading over duck_time seconds
duck_db=-9.0
duck_time=0.35
fade_in=2.5

[ambience]

file=""

[voice]

; narrator (the OS text-to-speech voice); V toggles it in game, M toggles the music
enabled=true
; first English voice whose name contains one of these wins (same order as the web game)
preferred=["Daniel", "Arthur", "Oliver", "Alex", "Aaron", "Samantha"]
rate=1.04
pitch=0.92
volume=85

[sfx]

; defaults for every [sfx.<id>]: volume (dB) and random pitch spread (+/- fraction)
volume_db=0.0
pitch_jitter=0.04
; 3D sounds fade out past this distance (metres)
max_distance=25.0


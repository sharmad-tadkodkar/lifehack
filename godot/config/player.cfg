; Player movement.

[movement]

walk_speed=1.6
; Mixamo Jogging strides about 1.85 m/s; above 1.5x its playback the feet slide
jog_speed=2.75
; m/s² while steering / while letting go
acceleration=9.0
deceleration=12.0
; how quickly the body turns toward the move direction (higher = snappier)
turn_rate=10.0
gravity=9.8

[auto_walk]

; walking to a work spot on its own (menu open, autoplay)
arrive_radius=0.06
; give up and snap if blocked for this long (seconds)
timeout=4.0
